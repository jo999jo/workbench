<title>周周的工作台</title>
<style>
:root{
  --bg:#FAF7F2; --card:#FFFBFC; --text:#4A1B0C; --text2:#7A6E5E; --text3:#B8A99A;
  --border:#E8DFD2; --radius:12px; --radius-sm:8px;
  --primary:#D85A30; --primary-bg:#FAEEE8; --primary-border:#E8B8A8;
  --blue:#5B75B5; --blue-bg:#EEF1FA; --green:#6A9F6E; --green-bg:#EDF5EE;
  --gold:#BA7517; --gold-bg:#FAEEDA; --red:#D85A30; --red-bg:#FAEEE8;
  --purple:#8B7355; --purple-bg:#F5F0EA; --teal:#7A9A8E; --teal-bg:#EEF5F2;
  --pink:#C47A6A; --pink-bg:#FAEFEB;
  --side-w:200px; --side-collapsed:54px;
  --accent-line:4px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:15px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}

/* Top Bar */
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:0 16px;height:50px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 1px 3px rgba(139,115,85,.06)}
.topbar-logo{font-weight:700;font-size:.95rem;white-space:nowrap;color:var(--primary);cursor:default}
.topbar-date{font-size:.76rem;color:var(--text2);flex:1;white-space:nowrap}
.topbar-stats{display:flex;gap:12px;align-items:center}
.topbar-stat{text-align:center;min-width:38px}
.topbar-stat-num{font-size:.9rem;font-weight:700;line-height:1.2}
.topbar-stat-num.c-primary{color:var(--primary)} .topbar-stat-num.c-green{color:var(--green)}
.topbar-stat-num.c-gold{color:var(--gold)}
.topbar-stat-label{font-size:.58rem;color:var(--text3)}
.topbar-progress{width:60px;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.topbar-progress-fill{height:100%;background:var(--primary);border-radius:2px;transition:width .4s}
.topbar-btn{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:.7rem;cursor:pointer;color:var(--text2);white-space:nowrap;transition:all .15s}
.topbar-btn:hover{background:var(--primary-bg);border-color:var(--primary-border);color:var(--primary)}
.date-nav{display:flex;align-items:center;gap:3px}
.date-nav-btn{background:transparent;border:none;color:var(--text2);font-size:.7rem;cursor:pointer;padding:3px 8px;border-radius:5px}
.date-nav-btn:hover{background:var(--bg)}
.date-nav-btn.today{font-weight:700;color:var(--primary);background:var(--primary-bg)}

/* Layout */
.main-layout{display:flex;min-height:calc(100vh - 50px);max-width:1600px;margin:0 auto}

/* Sidebar - 06+10 terracotta theme */
.sidebar{width:var(--side-w);background:var(--card);border-right:1px solid var(--border);flex-shrink:0;display:flex;flex-direction:column;transition:width .2s;overflow:hidden;position:sticky;top:50px;height:calc(100vh - 50px)}
.sidebar.collapsed{width:var(--side-collapsed)}
.sidebar-inner{padding:8px;flex:1;overflow-y:auto;overflow-x:hidden}
.side-nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:.82rem;transition:all .15s;border-left:var(--accent-line) solid transparent;white-space:nowrap;position:relative;color:var(--text2)}
.nav-item:hover{background:var(--primary-bg);color:var(--text)}
.nav-item.active{background:var(--primary-bg);border-left-color:var(--primary);color:var(--primary);font-weight:600}
.nav-item .nav-icon{font-size:1.05rem;flex-shrink:0;width:24px;text-align:center;line-height:1}
.nav-item .nav-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.nav-item .nav-badge{background:var(--primary);color:#fff;font-size:.62rem;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 6px;font-weight:600;flex-shrink:0}
.nav-item .nav-badge.empty{background:var(--border);color:var(--text3);font-weight:400}
.sidebar.collapsed .nav-label,.sidebar.collapsed .nav-badge{display:none}
.sidebar.collapsed .nav-item{padding:10px 14px;justify-content:center}
.sidebar.collapsed .nav-item .nav-icon{font-size:1.15rem;width:auto}
.sidebar-toggle{display:flex;align-items:center;justify-content:center;padding:8px;border-top:1px solid var(--border);cursor:pointer;font-size:.72rem;color:var(--text2);gap:5px;transition:all .12s;white-space:nowrap;user-select:none}
.sidebar-toggle:hover{background:var(--primary-bg);color:var(--primary)}
.sidebar-toggle .toggle-icon{display:inline-block;transition:transform .2s;font-size:.82rem}
.sidebar.collapsed .sidebar-toggle .toggle-icon{transform:rotate(180deg)}

/* Content */
.content{flex:1;min-width:0;padding:12px 16px;overflow-y:auto}
.content-panel{display:none}
.content-panel.active{display:block}

/* Panel grid */
.panel-grid{display:grid;gap:12px}

/* Card */
.card{background:var(--card);border-radius:var(--radius);box-shadow:0 2px 8px rgba(139,115,85,.06);padding:16px;display:flex;flex-direction:column;border:1px solid var(--border)}
.card-hd{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:.88rem;font-weight:700;flex-shrink:0}
.card-hd .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.card-hd .cnt{font-size:.67rem;color:var(--text3);margin-left:auto;background:var(--bg);padding:2px 10px;border-radius:6px;font-weight:400}
.card-body{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.card-body::-webkit-scrollbar{width:4px}
.card-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* Task */
.task-item{background:var(--bg);border-radius:8px;padding:10px 12px;margin-bottom:7px;border:1px solid transparent;transition:all .15s;cursor:default}
.task-item:hover{border-color:var(--primary-border);background:var(--card)}
.task-item.done-item{opacity:.5}
.task-item.done-item .task-text{text-decoration:line-through;color:var(--text3)}
.task-top{display:flex;align-items:flex-start;gap:8px}
.task-chk{width:20px;height:20px;border:2px solid var(--text3);border-radius:5px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;background:var(--card);margin-top:1px}
.task-chk:hover{border-color:var(--primary)}
.task-chk.done{background:var(--primary);border-color:var(--primary)}
.task-chk.done::after{content:"\2713";color:#fff;font-size:.65rem;font-weight:bold}
.task-body{flex:1;min-width:0}
.task-text{font-size:.8rem;line-height:1.5;word-break:break-word}
.task-row{display:flex;align-items:center;gap:6px;margin-top:5px;flex-wrap:wrap}
.task-badge{font-size:.66rem;color:var(--text2);background:var(--card);padding:2px 7px;border-radius:5px;border:1px solid var(--border)}
.task-links{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.task-link{font-size:.63rem;padding:2px 7px;border-radius:4px;background:var(--primary-bg);color:var(--primary);text-decoration:none;font-weight:500}
.task-link:hover{background:var(--primary);color:#fff}
.task-actions{display:flex;gap:3px;margin-left:auto;align-items:center;flex-shrink:0}
.task-del{width:22px;height:22px;border:none;background:transparent;color:var(--text3);cursor:pointer;font-size:.75rem;border-radius:5px;opacity:0;transition:all .12s;display:flex;align-items:center;justify-content:center}
.task-item:hover .task-del{opacity:1}
.task-del:hover{background:var(--red-bg);color:var(--red)}
.task-note-wrap{margin-top:7px;padding-top:7px;border-top:1px dashed var(--border);display:none}
.task-item.expanded .task-note-wrap{display:block}
.task-note-area{width:100%;border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:.7rem;font-family:inherit;resize:vertical;min-height:36px;background:var(--card);color:var(--text)}
.task-note-area:focus{outline:none;border-color:var(--primary)}
.task-note-hint{font-size:.63rem;color:var(--text3);cursor:pointer;margin-top:4px;display:inline-block;user-select:none}
.task-note-hint:hover{color:var(--primary)}
.count-btns{display:inline-flex;align-items:center;gap:3px;margin-left:5px}
.count-btn{width:20px;height:20px;border:1px solid var(--border);border-radius:5px;background:var(--card);cursor:pointer;font-size:.65rem;display:flex;align-items:center;justify-content:center;color:var(--text2)}
.count-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-bg)}
.quick-add{display:flex;gap:5px;margin-bottom:10px;flex-shrink:0}
.quick-add input{flex:1;border:1px solid var(--border);border-radius:7px;padding:6px 10px;font-size:.74rem;font-family:inherit;background:var(--bg)}
.quick-add input:focus{outline:none;border-color:var(--primary);background:var(--card)}
.quick-add button{background:var(--primary);color:#fff;border:none;border-radius:7px;padding:6px 14px;font-size:.72rem;cursor:pointer;font-weight:500;white-space:nowrap}
.quick-add button:hover{filter:brightness(1.08)}

/* Review row */
.review-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:12px}

/* Memo */
.memo-section{margin-bottom:16px}
.memo-ta{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:.76rem;font-family:inherit;resize:vertical;min-height:130px;background:var(--bg);line-height:1.6}
.memo-ta:focus{outline:none;border-color:var(--primary);background:var(--card)}
.memo-ft{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.memo-remind{display:flex;align-items:center;gap:5px;font-size:.7rem;color:var(--text2);cursor:pointer}
.memo-remind input{accent-color:var(--primary);width:16px;height:16px}
.memo-saved{font-size:.64rem;color:var(--green);display:none}
.memo-saved.show{display:inline}
.memo-reminder-alert{background:var(--red-bg);border:2px solid var(--primary);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:.74rem;color:var(--primary);font-weight:600;line-height:1.5;animation:pulse 3s infinite}
.memo-reminder-alert .alert-tag{display:inline-block;background:var(--primary);color:#fff;font-size:.6rem;padding:2px 8px;border-radius:6px;margin-right:8px;text-transform:uppercase}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(216,90,48,.2)}50%{box-shadow:0 0 0 6px rgba(216,90,48,0)}}
.memo-divider{border:none;border-top:2px solid var(--border);margin:16px 0}

/* Countdown in memo */
.cd-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.cd-item:last-child{border-bottom:none}
.cd-info{flex:1;min-width:0}
.cd-title{font-size:.78rem;font-weight:600}
.cd-date{font-size:.66rem;color:var(--text2);margin-top:2px}
.cd-days{font-size:1.15rem;font-weight:700;color:var(--primary);white-space:nowrap;min-width:36px;text-align:center}
.cd-days.past{color:var(--text3)}
.cd-label{font-size:.6rem;color:var(--text3);white-space:nowrap}
.cd-btn{width:22px;height:22px;border:none;background:transparent;color:var(--text3);cursor:pointer;font-size:.72rem;border-radius:5px;display:flex;align-items:center;justify-content:center;opacity:0;transition:all .12s}
.cd-item:hover .cd-btn{opacity:1}
.cd-btn:hover{background:var(--red-bg);color:var(--red)}
.cd-add{display:flex;gap:7px;margin-top:10px}
.cd-add input{flex:1;border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:.7rem;font-family:inherit;background:var(--bg)}
.cd-add input:focus{outline:none;border-color:var(--primary);background:var(--card)}
.cd-add input.cd-date-input{flex:0 0 105px;min-width:85px}
.cd-add button{background:var(--primary);color:#fff;border:none;border-radius:6px;padding:6px 12px;font-size:.68rem;cursor:pointer;font-weight:500;white-space:nowrap}
.cd-add button:hover{filter:brightness(1.08)}

/* Invest */
.gold-row{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
.study-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0}
.study-label{font-size:.78rem;flex:1}
.study-stat{font-size:.72rem;color:var(--text3);font-weight:600}
/* Study panel - 可展开学习卡片 */
.study-item{border:1px solid var(--border);border-radius:8px;margin-bottom:8px;overflow:hidden;background:var(--card)}
.study-item.done{border-color:var(--green);background:var(--green-bg)}
.study-item-hd{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;user-select:none}
.study-item-icon{font-size:.7rem;color:var(--text3)}
.study-item-title{font-size:.78rem;font-weight:600;flex:1;color:var(--text)}
.study-item-meta{font-size:.66rem;color:var(--text3);background:var(--bg);padding:2px 7px;border-radius:4px}
.study-done-btn{font-size:.66rem;border:none;background:var(--teal);color:#fff;padding:4px 10px;border-radius:5px;cursor:pointer;white-space:nowrap}
.study-done-btn:hover{filter:brightness(1.1)}
.study-done-tag{font-size:.66rem;color:var(--green);font-weight:600}
.study-item-body{padding:0 12px 12px;border-top:1px solid var(--border)}
/* 雅思单词卡片 */
.study-word-card{background:var(--bg);border-radius:6px;padding:8px 10px;margin-top:8px}
.sw-word{font-size:.82rem;font-weight:700;color:var(--blue)}
.sw-phonetic{font-size:.68rem;color:var(--text3);font-weight:400;margin-left:6px}
.sw-meaning{font-size:.74rem;color:var(--text);margin-top:3px}
.sw-example{font-size:.68rem;color:var(--text2);margin-top:3px;font-style:italic}
/* 雅思阅读卡片 */
.study-read-card{background:var(--bg);border-radius:6px;padding:8px 10px;margin-top:8px}
.sr-title{font-size:.78rem;font-weight:700;color:var(--primary)}
.sr-passage{font-size:.7rem;color:var(--text2);margin-top:4px;line-height:1.6}
.sr-q{font-size:.7rem;color:var(--text);margin-top:6px}
.sr-ans-summary{font-size:.68rem;color:var(--primary);cursor:pointer;margin-top:4px}
.sr-ans{font-size:.7rem;color:var(--green);margin-top:3px;font-weight:600}
.sr-analysis{font-size:.68rem;color:var(--text2);margin-top:3px}
/* 外贸词汇卡片 */
.study-trade-card{background:var(--bg);border-radius:6px;padding:8px 10px;margin-top:8px}
.st-en{font-size:.78rem;font-weight:700;color:var(--gold)}
.st-cn{font-size:.72rem;color:var(--text);margin-top:2px}
.st-usage{font-size:.68rem;color:var(--text2);margin-top:3px;line-height:1.5}
/* 跨境电商知识卡片 */
.study-ecom-card{background:var(--bg);border-radius:6px;padding:8px 10px;margin-top:8px}
.se-topic{font-size:.78rem;font-weight:700;color:var(--teal)}
.se-content{font-size:.7rem;color:var(--text);margin-top:4px;line-height:1.6}
.se-tip{font-size:.68rem;color:var(--gold);background:var(--gold-bg);padding:5px 8px;border-radius:4px;margin-top:6px}
/* 听力卡片 */
.study-listen-card{background:var(--bg);border-radius:6px;padding:8px 10px;margin-top:8px}
.sl-scene{font-size:.78rem;font-weight:700;color:var(--purple)}
.sl-passage{font-size:.7rem;color:var(--text2);margin-top:4px;line-height:1.6;font-style:italic}
.sl-q{font-size:.7rem;color:var(--text);margin-top:6px}
.sl-ans-summary{font-size:.68rem;color:var(--primary);cursor:pointer;margin-top:4px}
.sl-ans{font-size:.7rem;color:var(--green);margin-top:3px;font-weight:600}
.sl-analysis{font-size:.68rem;color:var(--text2);margin-top:3px}
/* 口语卡片 */
.study-speak-card{background:var(--bg);border-radius:6px;padding:8px 10px;margin-top:8px}
.sp-topic{font-size:.78rem;font-weight:700;color:var(--pink)}
.sp-cue{font-size:.7rem;color:var(--text2);margin-top:4px;line-height:1.6}
.sp-sample-summary{font-size:.68rem;color:var(--primary);cursor:pointer;margin-top:4px}
.sp-sample{font-size:.7rem;color:var(--text);margin-top:3px;line-height:1.6}
.sp-tips{font-size:.68rem;color:var(--gold);margin-top:4px}
/* 达人/求职/脚本面板共用样式 */
.talent-stats{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.talent-stat-chip{font-size:.64rem;background:var(--bg);padding:3px 8px;border-radius:4px;color:var(--text2);border:1px solid var(--border)}
.talent-list{display:flex;flex-direction:column;gap:8px}
.talent-card,.job-card,.script-card{background:var(--bg);border-radius:8px;padding:10px 12px;border:1px solid var(--border)}
.talent-card-hd,.job-card-hd,.script-card-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.talent-name,.job-company,.script-title{font-size:.8rem;font-weight:700;color:var(--text)}
.talent-stage-badge,.script-effect-badge{font-size:.62rem;padding:2px 7px;border-radius:4px;font-weight:600}
.talent-info,.script-info{display:flex;gap:8px;flex-wrap:wrap;font-size:.66rem;color:var(--text2);margin-bottom:4px}
.talent-contact{font-size:.66rem;color:var(--blue);margin-bottom:3px}
.talent-note{font-size:.66rem;color:var(--text2);margin-top:3px;line-height:1.5}
.talent-actions,.script-actions{display:flex;gap:5px;margin-top:8px}
.talent-stage-btn,.talent-edit-btn,.talent-del-btn{font-size:.64rem;padding:4px 10px;border-radius:5px;border:1px solid var(--border);background:var(--card);cursor:pointer;color:var(--text2)}
.talent-stage-btn{background:var(--primary);color:#fff;border-color:var(--primary)}
.talent-stage-btn:disabled{background:var(--text3);border-color:var(--text3);cursor:not-allowed}
.talent-stage-btn:hover:not(:disabled){filter:brightness(1.1)}
.talent-edit-btn:hover{border-color:var(--blue);color:var(--blue)}
.talent-del-btn:hover{border-color:var(--red);color:var(--red)}
.script-line{font-size:.66rem;color:var(--text2);margin-top:3px;line-height:1.5}
.script-info span{background:var(--card);padding:1px 5px;border-radius:3px}
/* 历史记录弹窗 */
.study-hist-day{background:var(--bg);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.study-hist-date{font-size:.76rem;font-weight:700;color:var(--text);margin-bottom:6px}
.study-hist-cat{margin-left:8px;margin-bottom:6px}
.study-hist-cat-name{font-size:.7rem;font-weight:600;color:var(--primary)}
.study-hist-item{font-size:.66rem;color:var(--text2);padding:2px 0;margin-left:8px}
.hist-phonetic{color:var(--text3)}
.hist-meaning{color:var(--text)}
.hist-cn{color:var(--text)}
.hist-q{color:var(--text2);margin-top:2px}
.hist-a{color:var(--green);margin-top:1px}
.gold-price{font-size:1.4rem;font-weight:700;color:var(--gold)}
.gold-change{font-size:.76rem;font-weight:600}
.gold-change.up{color:var(--red)} .gold-change.down{color:var(--green)}
.gold-sub{font-size:.67rem;color:var(--text3);margin-bottom:12px}
.gold-multi{display:flex;flex-direction:column;gap:8px}
.gold-row-item{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:6px 8px;background:var(--bg);border-radius:6px;border:1px solid var(--border)}
.gold-row-name{font-size:.7rem;color:var(--text2);flex:1;min-width:0}
.gold-row-price{font-size:.92rem;font-weight:700;color:var(--gold);white-space:nowrap}
.gold-row-chg{font-size:.7rem;font-weight:600;min-width:60px;text-align:right}
.gold-row-chg.up{color:var(--red)} .gold-row-chg.down{color:var(--green)}
.fund-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:.76rem}
.fund-row:last-child{border-bottom:none}
.fund-row .fname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fund-row .fval{font-weight:600;margin-left:10px}
.fund-row .fval.up{color:var(--red)} .fund-row .fval.down{color:var(--green)}
.fund-add-btn{width:100%;border:1px dashed var(--border);border-radius:6px;padding:7px;font-size:.7rem;text-align:center;color:var(--text3);cursor:pointer;background:transparent;margin-top:8px;transition:all .12s}
.fund-add-btn:hover{border-color:var(--gold);color:var(--gold);background:var(--gold-bg)}
.fund-batch-ta{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:.76rem;font-family:inherit;resize:vertical;min-height:80px;background:var(--bg);line-height:1.6}
.fund-batch-ta:focus{outline:none;border-color:var(--primary);background:var(--card)}
.fund-batch-actions{display:flex;gap:7px;margin-top:10px}
.fund-batch-btn{flex:1;border:none;border-radius:7px;padding:8px 14px;font-size:.74rem;cursor:pointer;font-weight:500;background:var(--bg);border:1px solid var(--border);color:var(--text2)}
.fund-batch-btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.fund-batch-btn.primary:hover{filter:brightness(1.08)}
.fund-batch-btn:hover{border-color:var(--primary);color:var(--primary)}
.fund-mgmt-list{max-height:160px;overflow-y:auto}
.fund-mgmt-row{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;background:var(--bg);border-radius:6px;margin-bottom:4px;font-size:.74rem}
.fund-mgmt-code{font-family:monospace;font-weight:600;color:var(--blue)}
.fund-mgmt-del{border:none;background:transparent;color:var(--text3);cursor:pointer;font-size:.66rem;padding:2px 8px;border-radius:4px}
.fund-mgmt-del:hover{background:var(--red-bg);color:var(--red)}

/* Study */
.study-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0}
.study-label{font-size:.78rem;flex:1}
.study-bar-wrap{width:60px;height:5px;background:var(--border);border-radius:3px;overflow:hidden;flex-shrink:0}
.study-bar-fill{height:100%;background:var(--teal);border-radius:3px;transition:width .3s}
.study-stat{font-size:.66rem;color:var(--text3);min-width:36px;text-align:right;flex-shrink:0}
.life-row{display:flex;align-items:flex-start;gap:7px;padding:6px 0;font-size:.76rem;border-bottom:1px solid var(--border)}
.life-row:last-child{border-bottom:none}
.life-chk{width:18px;height:18px;border:2px solid var(--text3);border-radius:4px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:2px;background:var(--card)}
.life-chk:hover{border-color:var(--teal)}
.life-chk.done{background:var(--teal);border-color:var(--teal)}
.life-chk.done::after{content:"\2713";color:#fff;font-size:.55rem}
.life-row.done .life-txt{text-decoration:line-through;color:var(--text3)}
.life-txt{flex:1;line-height:1.5}
.life-del{width:18px;height:18px;border:none;background:transparent;color:var(--text3);cursor:pointer;font-size:.68rem;opacity:0;border-radius:4px;display:flex;align-items:center;justify-content:center}
.life-row:hover .life-del{opacity:1}
.life-del:hover{background:var(--red-bg);color:var(--red)}

/* Plan */
.plan-sec{margin-bottom:14px}
.plan-sec-hd{font-size:.78rem;font-weight:600;color:var(--text2);margin-bottom:7px;padding-left:6px;border-left:3px solid var(--primary)}
.plan-item{display:flex;align-items:flex-start;gap:7px;padding:5px 0;font-size:.75rem}
.plan-dot{width:7px;height:7px;border-radius:50%;background:var(--text3);margin-top:6px;flex-shrink:0;cursor:pointer;transition:all .15s}
.plan-item.done .plan-dot{background:var(--green)}
.plan-dot:hover{transform:scale(1.4)}
.plan-info{flex:1;min-width:0}
.plan-pbar{width:64px;height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:4px}
.plan-pfill{height:100%;background:var(--purple);border-radius:2px;transition:width .3s}
.plan-pct{font-size:.62rem;color:var(--text3);margin-left:6px}

/* Hot content */
.hot-platform-tabs{display:flex;gap:5px;margin-bottom:12px}
.hot-ptab{padding:5px 14px;border-radius:7px;font-size:.73rem;cursor:pointer;border:1px solid var(--border);background:var(--bg);color:var(--text2);transition:all .12s;font-weight:500}
.hot-ptab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.hot-cat-tabs{display:flex;gap:5px;margin-bottom:12px}
.hot-ctab{padding:4px 12px;border-radius:6px;font-size:.7rem;cursor:pointer;border:1px solid var(--border);background:var(--bg);color:var(--text2);transition:all .12s}
.hot-ctab.active{background:var(--pink);color:var(--pink-bg);border-color:var(--pink);color:#fff}
.hot-card{background:var(--bg);border-radius:8px;padding:10px 12px;margin-bottom:7px;border:1px solid var(--border);transition:all .12s}
.hot-card:hover{border-color:var(--primary-border)}
.hot-card-title{font-size:.78rem;font-weight:600;margin-bottom:4px;color:var(--text)}
.hot-card-desc{font-size:.69rem;color:var(--text2);line-height:1.5}
.hot-card-tag{display:inline-block;font-size:.6rem;padding:2px 7px;border-radius:4px;margin-top:5px;margin-right:3px}
.hot-card-tag.dy{background:var(--text);color:#fff}
.hot-card-tag.xhs{background:var(--red-bg);color:var(--red)}
.hot-card-tag.mz{background:var(--pink-bg);color:var(--pink)}
.hot-card-tag.jz{background:var(--teal-bg);color:var(--teal)}
.hot-card-tag.goods{background:var(--gold-bg);color:var(--gold)}
.hot-card-tag.dg{background:var(--blue-bg);color:var(--blue)}
.hot-refresh{font-size:.67rem;color:var(--text3);cursor:pointer;margin-left:10px;font-weight:400}
.hot-refresh:hover{color:var(--primary)}
.hot-insight-block{background:var(--bg);border-left:3px solid var(--primary);border-radius:0 6px 6px 0;padding:7px 10px;margin-top:8px}
.hot-insight-line{font-size:.66rem;color:var(--text2);line-height:1.6;word-break:break-word}
.hot-insight-line:first-child{color:var(--primary);font-weight:600}
.hot-card-tags{margin-top:6px}
.hot-card-links{margin-top:7px;display:flex;gap:5px;flex-wrap:wrap}
.hot-video-link,.hot-search-link{font-size:.65rem;padding:3px 9px;border-radius:5px;text-decoration:none;font-weight:500;display:inline-block}
.hot-video-link{background:var(--primary);color:#fff}

  {title:"海洋塑料污染的解决方案",level:1,passage:"Scientists estimate that 8 million tons of plastic enter the oceans each year. While cleanup efforts are important, researchers emphasize that reducing plastic at the source is more effective. Innovative solutions include biodegradable alternatives and deposit-return schemes that have shown success in several European countries.",question:"What do researchers consider more effective than cleanup efforts?",answer:"Reducing plastic at the source.",analysis:"注意比较结构more effective than，答案在源头减塑。"},
  {title:"人工智能在教育中的应用",level:1,passage:"AI-powered tutoring systems can adapt to individual learning paces, providing personalized feedback that traditional classrooms cannot offer. However, critics argue that over-reliance on AI may diminish human interaction essential for social skill development. The key, experts suggest, lies in finding a balance between technology and human teaching.",question:"What is the main concern of critics regarding AI in education?",answer:"Over-reliance on AI may diminish human interaction essential for social skill development.",analysis:"critics argue后是观点，注意diminish human interaction这个核心表达。"},
  {title:"城市绿地对心理健康的作用",level:1,passage:"Research indicates that access to green spaces in urban areas significantly reduces stress levels and improves overall mental health. A study of 20,000 city residents found that those living within 300 meters of a park reported 40% lower rates of anxiety. Urban planners are now incorporating green spaces as essential infrastructure rather than optional amenities.",question:"How much lower were anxiety rates for people living near parks?",answer:"40% lower rates of anxiety.",analysis:"数字题，定位300 meters和40%。"},
  {title:"可再生能源的经济可行性",level:1,passage:"The cost of solar energy has dropped by 90% over the past decade, making it cheaper than fossil fuels in many regions. Wind energy has seen similar trends. However, the intermittency of renewable sources requires investment in energy storage technology, which remains a significant challenge for full replacement of traditional power plants.",question:"What is the main challenge for full replacement of traditional power plants?",answer:"The intermittency of renewable sources requires investment in energy storage technology.",analysis:"challenge关键词定位，注意intermittency和storage。"},
  {title:"全球化对本土文化的影响",level:1,passage:"Globalization has led to both cultural exchange and cultural homogenization. While some argue that global brands erode local traditions, others point to the revival of indigenous cultures as communities assert their identity in response to global influences. The net effect depends largely on local policies and community engagement.",question:"What determines the net effect of globalization on local culture?",answer:"Local policies and community engagement.",analysis:"depends largely on后是答案。"},
  {title:"儿童早期教育的重要性",level:1,passage:"Studies consistently show that investments in early childhood education yield returns of $7 to $12 for every dollar spent, through reduced crime rates, higher lifetime earnings, and better health outcomes. Despite this evidence, many countries allocate minimal funding to preschool programs compared to higher education.",question:"What is the return on investment for early childhood education?",answer:"$7 to $12 for every dollar spent.",analysis:"数字题，yield returns of定位。"},
  {title:"社交媒体对青少年自尊的影响",level:1,passage:"A longitudinal study of 1,500 teenagers found that those who spent more than three hours daily on social media platforms reported significantly lower self-esteem and higher rates of depression. The comparison effect—seeing peers' curated highlight reels—was identified as a primary factor, rather than screen time alone.",question:"What was identified as the primary factor affecting self-esteem?",answer:"The comparison effect—seeing peers' curated highlight reels.",analysis:"primary factor后是答案，注意rather than表转折。"},
  {title:"水资源短缺与农业创新",level:1,passage:"With freshwater supplies dwindling, farmers in arid regions are adopting drip irrigation, which delivers water directly to plant roots, reducing usage by up to 60%. Other innovations include drought-resistant crop varieties and recycled wastewater systems. These technologies are crucial as agriculture accounts for 70% of global freshwater use.",question:"How much water can drip irrigation save?",answer:"Up to 60%.",analysis:"reducing usage by up to 60%定位。"},
  {title:"电子垃圾的回收挑战",level:2,passage:"The world produces 50 million tons of e-waste annually, but only 20% is formally recycled. The rest ends up in landfills, where toxic substances like lead and mercury contaminate soil and water. Experts call for extended producer responsibility laws to force manufacturers to design products with recycling in mind.",question:"What percentage of e-waste is formally recycled?",answer:"Only 20%.",analysis:"数字题，but only 20%转折。"},
  {title:"睡眠与认知表现的关系",level:2,passage:"Research shows that sleep deprivation significantly impairs cognitive function, with effects comparable to alcohol intoxication after 17 hours of wakefulness. Memory consolidation, problem-solving ability, and emotional regulation all depend on adequate sleep. Despite this, modern work culture often glorifies sleep deprivation as a sign of dedication.",question:"What is the effect of sleep deprivation compared to after 17 hours of wakefulness?",answer:"Comparable to alcohol intoxication.",analysis:"comparable to定位。"},
  {title:"生物多样性与生态系统稳定性",level:2,passage:"Ecosystems with higher biodiversity are more resilient to environmental changes. A study of grassland ecosystems found that plots with more plant species recovered faster from drought and maintained higher productivity. This suggests that biodiversity loss may destabilize ecosystems that humans depend on for food and clean water.",question:"What did the grassland study find about plots with more species?",answer:"They recovered faster from drought and maintained higher productivity.",analysis:"found that后是答案。"},
  {title:"无人驾驶汽车的法律与伦理问题",level:2,passage:"Self-driving cars promise to reduce accidents caused by human error, but raise complex ethical questions. In an unavoidable collision, how should the AI prioritize lives? Legal frameworks have yet to catch up, with most countries lacking clear liability rules for accidents involving autonomous vehicles.",question:"What complex issue does the passage highlight about self-driving cars?",answer:"In an unavoidable collision, how should the AI prioritize lives, and legal frameworks have yet to catch up.",analysis:"ethical questions和legal frameworks两个层面。"},
  {title:"食品添加剂的安全性争议",level:2,passage:"While food regulators approve many additives as safe in small quantities, some studies link artificial colors and preservatives to hyperactivity in children. The precautionary principle suggests limiting exposure, especially for vulnerable populations, until long-term effects are better understood.",question:"What does the precautionary principle suggest about food additives?",answer:"Limiting exposure, especially for vulnerable populations, until long-term effects are better understood.",analysis:"suggests后是答案。"},
  {title:"城市化对生物栖息地的破坏",level:2,passage:"Urban expansion destroys approximately 2 million hectares of natural habitat annually. Fragmentation of habitats isolates wildlife populations, reducing genetic diversity and increasing extinction risk. Wildlife corridors—strips of habitat connecting fragmented areas—have shown promise in maintaining biodiversity in urbanized regions.",question:"What solution has shown promise in maintaining biodiversity?",answer:"Wildlife corridors—strips of habitat connecting fragmented areas.",analysis:"solution关键词，wildlife corridors定位。"},
  {title:"工作场所多样性的商业价值",level:2,passage:"Companies with diverse workforces are 35% more likely to outperform their competitors financially, according to a McKinsey study. Diversity brings varied perspectives that enhance innovation and problem-solving. However, mere representation is insufficient; inclusive cultures that value different viewpoints are essential to realize these benefits.",question:"What is essential to realize the benefits of diversity?",answer:"Inclusive cultures that value different viewpoints.",analysis:"essential to realize后是答案。"},
  {title:"海洋酸化对珊瑚礁的威胁",level:2,passage:"As oceans absorb excess CO2, they become more acidic, threatening coral reef ecosystems. Acidification reduces the availability of carbonate ions, which corals need to build skeletons. Scientists project that without significant emission reductions, 90% of coral reefs could be lost by 2050.",question:"Why does ocean acidification threaten coral reefs?",answer:"It reduces the availability of carbonate ions, which corals need to build skeletons.",analysis:"reduces the availability of定位因果关系。"},
  {title:"老龄化社会的经济挑战",level:2,passage:"By 2050, one in six people globally will be over 65, up from one in eleven in 2019. This demographic shift strains pension systems and healthcare, while shrinking the working-age population. Some countries respond by raising retirement ages and encouraging immigration to maintain workforce numbers.",question:"What are two responses to the aging population challenge?",answer:"Raising retirement ages and encouraging immigration.",analysis:"respond by后是答案。"},
  {title:"区块链在供应链管理中的应用",level:2,passage:"Blockchain technology enables transparent, immutable records of product journeys from origin to consumer. In food supply, this allows rapid tracing of contamination sources, reducing recall costs. However, implementation requires significant infrastructure investment and industry-wide standardization.",question:"What benefit does blockchain provide in food supply?",answer:"Rapid tracing of contamination sources, reducing recall costs.",analysis:"allows后是答案。"},
  {title:"微塑料对人体健康的潜在影响",level:3,passage:"Microplastics have been found in human blood, lungs, and breast milk, raising health concerns. While long-term effects remain unclear, studies suggest microplastics may cause inflammation and cellular damage. The WHO calls for more research, particularly on the most common exposure route through drinking water.",question:"What does the WHO call for regarding microplastics?",answer:"More research, particularly on the most common exposure route through drinking water.",analysis:"calls for后是答案。"},
  {title:"绿色建筑标准的推广",level:3,passage:"Green building certifications like LEED have driven construction toward energy efficiency and sustainable materials. Certified buildings use 25% less energy and 11% less water, while commanding higher rental premiums. Critics argue that certification costs exclude smaller developers, limiting widespread adoption.",question:"What are the benefits of green building certification?",answer:"Using 25% less energy and 11% less water, and commanding higher rental premiums.",analysis:"三个好处：energy, water, rental premiums。"},
  {title:"数字鸿沟与教育公平",level:3,passage:"The digital divide—the gap between those with access to technology and those without—exacerbates educational inequality. During school closures, students without home internet or devices fell behind peers by an estimated 3 to 6 months. Solutions include subsidized broadband and device lending programs.",question:"How far did students without technology access fall behind?",answer:"An estimated 3 to 6 months.",analysis:"数字题，fell behind定位。"},
  {title:"可持续渔业的认证体系",level:3,passage:"The Marine Stewardship Council certifies fisheries that meet sustainability standards, allowing them to display a blue ecolabel. Certified fisheries report better stock management, though critics note that some certifications lapse without sufficient monitoring. Consumer awareness of the label remains low at around 30% recognition.",question:"What is the recognition rate of the MSC ecolabel among consumers?",answer:"Around 30%.",analysis:"recognition关键词定位。"},
  {title:"工作自动化与技能转型",passace:"By 2030, automation may displace 400 million workers globally, while creating 555 million new jobs requiring different skills. The transition demands massive retraining programs. Workers in routine physical and cognitive tasks face the highest risk, while creative and social intelligence roles remain more resilient.",passage:"By 2030, automation may displace 400 million workers globally, while creating 555 million new jobs requiring different skills. The transition demands massive retraining programs. Workers in routine physical and cognitive tasks face the highest risk, while creative and social intelligence roles remain more resilient.",question:"Which types of roles are more resilient to automation?",answer:"Creative and social intelligence roles.",analysis:"more resilient后是答案。"},
  {title:"城市农业的兴起",level:3,passage:"Urban farming—growing food in cities through rooftop gardens, vertical farms, and community plots—reduces food transport emissions and improves food security. Singapore produces 10% of its vegetables through vertical farming, aiming for 30% by 2030. Challenges include high energy costs for indoor lighting.",question:"What percentage of vegetables does Singapore aim to produce by 2030?",answer:"30%.",analysis:"aiming for定位。"},
  {title:"算法偏见与公平性",level:3,passage:"AI algorithms trained on biased data can perpetuate discrimination in hiring, lending, and criminal justice. A famous case showed a recruitment tool downgrading female candidates. Solutions include diverse training data, algorithm audits, and human oversight, though no approach fully eliminates bias.",question:"What are three solutions to algorithm bias mentioned?",answer:"Diverse training data, algorithm audits, and human oversight.",analysis:"Solutions include后三个并列项。"},
  {title:"生态旅游的双刃剑效应",level:3,passage:"Ecotourism can fund conservation and support local communities, but poorly managed tourism damages the environments it aims to protect. Galapagos Islands limit visitor numbers to preserve ecosystems, demonstrating that sustainable tourism requires strict regulation and carrying capacity limits.",question:"What does the Galapagos example demonstrate about sustainable tourism?",answer:"It requires strict regulation and carrying capacity limits.",analysis:"demonstrating that后是答案。"},
  {title:"声音污染对海洋生物的影响",level:3,passage:"Shipping noise disrupts marine animals' communication, navigation, and feeding. Whales particularly rely on sound over long distances. Studies show that noise reduction measures, such as slower ship speeds, can recover marine communication within months, offering a relatively quick conservation win.",question:"What measure can recover marine communication quickly?",answer:"Slower ship speeds.",analysis:"such as后是具体措施。"},
  {title:"共享经济的监管挑战",level:3,passage:"Platforms like Airbnb and Uber operate in regulatory gray areas, disrupting traditional industries. Cities struggle to balance innovation with concerns over housing affordability and worker rights. New York requires short-term rental hosts to register, while Lisbon limits short-term stays in historic districts to protect local communities.",question:"What did Lisbon do to address short-term rental concerns?",answer:"Limited short-term stays in historic districts to protect local communities.",analysis:"while后是Lisbon的做法。"},
  {title:"植物性饮食的环境效益",level:3,passage:"Plant-based diets require 75% less land and water than meat-heavy diets, while producing 50% less greenhouse gas emissions. Beef production is particularly resource-intensive, using 20 times more land per gram of protein than beans. Shifts toward plant proteins could significantly reduce agriculture's environmental footprint.",question:"How much less land and water do plant-based diets require?",answer:"75% less.",analysis:"数字题，require定位。"}
];

  {topic:"TikTok Shop 入驻条件",content:"TikTok Shop 目前对东南亚（印尼/泰国/越南/马来西亚/菲律宾/新加坡）和英国开放本土店，美国区为半闭环。入驻需：营业执照、法人身份证、产品资质、品牌授权（如适用）、退货地址。东南亚本土店需当地身份证/护照和银行账户。",tip:"新手建议从印尼或泰国入手，市场大且竞争相对小。"},
  {topic:"亚马逊 FBA vs FBM 选择",content:"FBA（亚马逊物流）：卖家发货至亚马逊仓库，由其配送，享Prime标志，转化率高，但仓储费和配送费高。FBM（自发货）：卖家自行配送，成本低但无Prime，物流时效影响评价。选择标准：周转快的标准品选FBA，大件/低周转/试水品选FBM。",tip:"新品先用FBM测款，稳定后转FBA冲销量。"},
  {topic:"Shopee 选品策略",content:"东南亚市场选品要点：①价格带$3-15转化最好；②注意宗教文化（印尼清真、泰国佛教）；③季节相反（南半球）；④热卖类目：3C配件、美妆、家居小物、母婴。选品工具：Shopee趋势分析、Google Trends、竞品销量监控。",tip:"印尼市场穆斯林服饰和清真美妆是蓝海。"},
  {topic:"跨境电商收款方式对比",content:"主流收款工具：①Payoneer（派安盈）：费率1.2%，支持多平台；②PingPong：费率1%，到账快；③WorldFirst：费率1%，阿里投资；④连连支付：费率0.7%，国内服务好；⑤Airwallex：费率1%，支持多币种。选择看费率、到账速度、平台支持。",tip:"小卖家优先PingPong，大卖家用Airwallex管理多币种。"},
  {topic:"亚马逊 A9 算法排名因素",content:"A9算法决定搜索排名，核心因素：①销量权重（最重要）；②转化率；③相关性（标题/五行/后台关键词）；④价格竞争力；⑤库存状态；⑥Review数量和星级；⑦FBA优先。优化顺序：先做转化率，再冲销量，最后优化关键词。",tip:"新品期用PPC广告冲销量，带动自然排名。"},
  {topic:"TikTok 直播带货话术结构",content:"高效直播话术：①开场留人（福利/痛点/悬念）；②产品介绍（FAB法则：Feature特性→Advantage优势→Benefit利益）；③痛点放大（不用会怎样）；④价格锚定（专柜价vs直播间价）；⑤逼单（限时限量+库存倒计时）；⑥互动答疑。每15分钟一个循环。",tip:"逼单环节用「还剩X单」制造紧迫感。"},
  {topic:"跨境物流渠道选择",content:"主流渠道：①邮政小包（ePacket/4PX）：便宜慢，15-30天；②专线（云途/燕文）：中等价格7-15天；③商业快递（DHL/FedEx）：贵但快3-7天；④海外仓：本土发货1-3天，适合爆款。选择看客单价和时效要求：<$15选邮政/专线，>$50可考虑快递，爆款备海外仓。",tip:"做东南亚选云途专线，欧美选4PX。"},
  {topic:"亚马逊 Review 获取合规方法",content:"合规获取Review：①Amazon Vine计划（品牌备案卖家可参加）；②Request Review按钮（订单送达后5-30天可点）；③产品包装内插卡片（不能要求好评或返现）；④售后服务邮件跟进。禁止：刷单、返现好评、诱导好评。违规会封号。",tip:"新品上架先开Vine，积累30+ Review再投广告。"},
  {topic:"Shopee 运费补贴规则",content:"Shopee运费补贴：买家满额免运费，卖家获平台补贴。各站点免运门槛：台湾$99、印尼Rp50000、泰国THB150、越南VND150000。卖家可参加免运活动（FSS）获更多曝光。注意：补贴有上限，超重件差额需买家补。",tip:"参加FSS活动店铺转化率提升20%+。"},
  {topic:"跨境电商退税政策",content:"出口退税：跨境电商零售出口（9610）可退增值税。条件：①货物实际离境；②有报关单；③收汇；④财务做收入。退税率0-13%，按HS码查。综合试验区（如杭州、深圳）可「无票免税」：无进项发票也可免税出口。",tip:"注册在综合试验区可简化退税流程。"},
  {topic:"TikTok 小店商品挂车条件",content:"TikTok短视频挂车条件：①账号≥1000粉丝；②账号无违规；③开通小店并绑定账号；④商品在小店审核通过。直播挂车无粉丝门槛，但需开通橱窗。挂车位置：短视频左下角黄色购物车，直播间购物袋。",tip:"0粉起步先做直播，短视频粉丝达标后再挂车。"},
  {topic:"亚马逊 PPC 广告类型",content:"三种广告：①Sponsored Products（商品推广）：关键词/商品投放，最常用；②Sponsored Brands（品牌推广）：标题+Logo+商品集合，需品牌备案；③Sponsored Display（展示推广）：基于受众投放，可投站外。竞价模式：CPC，实际扣费=次名出价+0.01。",tip:"新品SP自动广告跑词，手动广告精准打。"},
  {topic:"Lazada vs Shopee 平台对比",content:"Shopee：流量大、佣金低（1-5%）、免运补贴多、适合铺货。Lazada：客单价高、品牌LazMall权益好、阿里支持物流、适合精品。佣金对比：Shopee 1-5%，Lazada 2-5%。市场：Shopee印尼/台湾强，Lazada菲律宾/泰国强。",tip:"两平台都开，分散风险，测哪个出单快。"},
  {topic:"跨境电商选品工具推荐",content:"选品工具：①Jungle Scout（亚马逊选品，$49/月）；②Helium 10（亚马逊综合，$97/月）；③卖家精灵（中国工具，性价比高）；④Google Trends（免费趋势）；⑤TikTok Creative Center（热门内容）。指标看：搜索量、销量、Review数、竞争度、利润率。",tip:"先用免费工具测方向，付费工具做深度验证。"},
  {topic:"亚马逊跟卖与防跟卖",content:"跟卖：在别人Listing下挂自己的offer，共享购物车。合规跟卖需：产品一致、有授权。防跟卖：①品牌备案+Transparency透明计划；②GCID商标编码；③修改Listing增加差异化；④监控工具及时投诉。恶意跟卖可投诉侵权。",tip:"品牌备案后立即加入Transparency计划。"},
  {topic:"跨境直播带货选品逻辑",content:"直播选品三梯队：①福利款（$1-5，亏本引流，占20%）；②利润款（$10-30，主推，占60%）；③形象款（$50+，拉升调性，占20%）。选品标准：视觉冲击强、可演示、痛点明显、价格有优势。避免：尺码依赖、需试用、保质期短。",tip:"每场直播准备3个福利款拉停留。"},
  {topic:"Shopify 独立站搭建要点",content:"独立站搭建：①域名（简短相关，.com优先）；②主题（免费Debut或付费Prestige）；③支付（PayPal+Stripe/2Checkout）；④物流（ePacket+专线+海外仓）；⑤像素（Facebook Pixel+TikTok Pixel）。成本：域名$10/年，Shopify $29/月起。",tip:"独立站核心是流量，先跑通Facebook广告再扩。"},
  {topic:"跨境电商知识产权合规",content:"侵权高风险类目：①动漫IP（迪士尼/漫威）；②品牌商标（Nike/Apple）；③外观专利（手机壳/玩具）；④发明专利。查询工具：USPTO（美商标）、Google Patents、亚马逊Brand Registry。收到侵权投诉：先下架，查是否真侵权，申诉需提供授权或专利无效证明。",tip:"上架前查商标和专利，避免封店。"},
  {topic:"亚马逊库存绩效指标 IPI",content:"IPI（Inventory Performance Index）衡量库存健康，0-1000分。≥450免超量费，<450限制入仓。提升方法：①清理冗余库存（降价/清货/弃置）；②提升售出率；③修复无在售信息；④平衡库存。每季度考核，影响仓储容量。",tip:"IPI低于450时优先清冗余，别补货。"},
  {topic:"TikTok 短视频算法机制",content:"TikTok算法：流量池层层推荐。初始池200-500播放，完播率>30%进下一池2000，互动率达标进万池，爆款冲百万。核心指标权重：完播率>分享>评论>点赞>关注。优化：前3秒留人、引导互动（提问/投票）、15-30秒最佳时长、字幕必加。",tip:"完播率是王道，前3秒决定生死。"},
  {topic:"跨境电商退货处理",content:"退货率：服装15-30%、3C 5-10%、家居5%。处理方式：①本地退货仓（欧美可选，二次销售）；②退款不退货（低价品<$$10，省运费）；③销毁（损坏品）。亚马逊FBA退货自动入库，需定期清理。Shopee支持7天无理由，需设退货地址。",tip:"退货成本>货值时直接退款不退货。"},
  {topic:"亚马逊 Brand Registry 品牌备案",content:"品牌备案条件：①有注册商标（美标/欧标等）；②商标活跃。权益：①A+页面（图文详情）；②品牌广告；③Vine计划；④Transparency防伪；⑤Brand Store店铺；⑥举报侵权。流程：提交商标号→审核（1-2周）→开通。",tip:"先注册美标（$350，8个月下证），再备案。"},
  {topic:"Shopee 站点选择策略",content:"各站点特点：①台湾：繁体，客单价高$15-30，适合新手；②印尼：人口2.7亿，价格敏感$3-10；③泰国：佛教国，美妆3C好卖$5-15；④越南：年轻化，服饰美妆$3-10；⑤马来西亚：华人多，中文友好$5-20；⑥菲律宾：英语，3C家居$3-15；⑦新加坡：高客单$10-50。",tip:"新手台湾起步，稳了再扩印尼。"},
  {topic:"跨境电商利润计算公式",content:"利润=售价-产品成本-头程运费-平台佣金-支付费-尾程运费-仓储费-广告费-退货损耗。例：售价$20，成本$4，头程$1，佣金15%=$3，支付3%=$0.6，尾程$2，仓储$0.5，广告$3，退货5%=$1，利润=$4.9，毛利率24.5%。广告占比超20%需优化。",tip:"毛利率低于15%慎重，广告吃掉利润。"},
  {topic:"TikTok Shop 东南亚本土店vs跨境店",content:"本土店：当地人身份证/护照+当地银行卡+当地仓发货，流量倾斜大、物流快、佣金低。跨境店：中国营业执照+中国收款，无需当地仓，但流量略低、物流慢。选择：有当地资源选本土店，无资源选跨境店起步。",tip:"菲律宾、泰国本土店流量优势最明显。"},
  {topic:"亚马逊 Listing 优化要点",content:"Listing优化：①标题（<200字符，核心词前置，品牌+特性+型号）；②五行卖点（5条，每条<500字符，痛点+利益）；③产品描述（A+页面优先）；④图片（主图白底1000x1000+，附图6张含场景/尺寸/对比）；⑤后台关键词（<250字节，不重复标题词）；⑥Review和Q&A。",tip:"主图点击率决定流量，先优化主图。"},
  {topic:"跨境电商VAT税务",content:"欧洲VAT：售往欧盟年销售额>€10000需注册VAT。各国阈值：英国£90000、德国€100000、法国€100000。注册后按月/季申报。远程销售超阈值需在目的国注册。违规罚金高。英国脱欧后单独申报。",tip:"做欧洲站先注册英德VAT，其他国家按需。"},
  {topic:"TikTok 直播数据复盘指标",content:"直播复盘核心指标：①观看人数（场观）；②平均停留时长（>1分钟及格）；③互动率（评论+点赞+分享/观看）；④商品点击率；⑤转化率（下单/点击）；⑥GMV；⑦客单价；⑧退货率。优化：停留低改开场，转化低改话术和选品。",tip:"每场直播后立即复盘，记录3个优化点。"},
  {topic:"跨境电商账号关联风险",content:"亚马逊账号关联：同一IP/设备/浏览器指纹登录多账号会被关联封号。防关联：①一台电脑一个账号；②使用VPS或防关联浏览器（紫鸟/候鸟）；③不同账号不同网卡；④不混用收款和电话。关联后申诉极难成功。",tip:"多账号必须用防关联浏览器，$20/月省大麻烦。"},
  {topic:"亚马逊秒杀活动申报",content:"秒杀类型：①Lightning Deal（LD）：4-6小时，$150费用；②7-Day Deal：7天，$300费用；③Prime Exclusive：会员专享。申报条件：Review≥3.5星、库存充足、折扣≥15%、历史价格合规。秒杀前2周提价，秒杀价回到正常价。",tip:"LD适合清库存和冲排名，7-Day适合稳出单。"}

// ============ DATA LAYER ============
function loadData(){
  const raw = localStorage.getItem('workbench_v5');
  if(raw){try{appData=JSON.parse(raw)}catch(e){appData={}}}
  if(!appData.dates)appData.dates={};
  // migrate old data
  if(appData.funds){}else appData.funds=[];
  if(!appData.plans)appData.plans=JSON.parse(JSON.stringify(D_PLANS));
  if(!appData.streak)appData.streak=0;
  if(!appData.lastActiveDate)appData.lastActiveDate='';
  if(!appData.userVideos)appData.userVideos=[];
  if(!appData.sideCollapsed)appData.sideCollapsed=false;
  // 达人资源库
  if(!appData.talents)appData.talents=[];
  // 脚本素材库
  if(!appData.scripts)appData.scripts=[];
  // 外企求职
  if(!appData.jobs)appData.jobs=[];
  // 学习进度：记录每个科目已学过的索引，保证不重复。雅思科目带 level 分级。
  if(!appData.studyProgress)appData.studyProgress={ielts_words:0,ielts_reading:0,ielts_listening:0,ielts_speaking:0,trade_words:0,ecommerce:0};
  // 雅思级别：1=初级 2=中级 3=高级，从1开始
  if(!appData.studyLevel)appData.studyLevel={ielts_words:1,ielts_reading:1,ielts_listening:1,ielts_speaking:1};
  // 错题本：记录做错的题目
  if(!appData.wrongBook)appData.wrongBook={ielts_reading:[],ielts_listening:[]};
  // 学习历史：按日期记录每天学过的内容，可回看
  if(!appData.studyHistory)appData.studyHistory={};
}
function saveData(){localStorage.setItem('workbench_v5',JSON.stringify(appData))}

function getDay(d){
  if(!appData.dates[d]){
    appData.dates[d]={workTasks:JSON.parse(JSON.stringify(D_WORK)),lifeTasks:JSON.parse(JSON.stringify(D_LIFE)),memo:'',memoRemind:false,review:'',inspiration:'',script:'',hotDaily:[]};
    saveData();
  }
  const day=appData.dates[d];
  // migrate old status field to done
  if(day.workTasks.length>0&&day.workTasks[0].status!==undefined&&day.workTasks[0].done===undefined){
    day.workTasks.forEach(t=>{t.done=t.status==='done';delete t.status;delete t._expanded;});
  }
  if(!day.hotDaily)day.hotDaily=[];
  // migrate: 给旧 lifeTasks 补 studyType 字段
  if(day.lifeTasks&&day.lifeTasks.length&&!day.lifeTasks[0].studyType){
    day.lifeTasks.forEach(t=>{
      if(t.studyType)return;
      if(/雅思单词|雅思.*词/.test(t.text))t.studyType='ielts_words';
      else if(/雅思.*阅读|文章阅读/.test(t.text))t.studyType='ielts_reading';
      else if(/雅思.*听力/.test(t.text))t.studyType='ielts_listening';
      else if(/雅思.*口语/.test(t.text))t.studyType='ielts_speaking';
      else if(/外贸|跨境.*词/.test(t.text))t.studyType='trade_words';
      else if(/跨境电商|TikTok.*Shop/.test(t.text))t.studyType='ecommerce';
    });
  }
  // migrate: 如果 lifeTasks 缺少听力/口语科目，补上
  const hasListening=day.lifeTasks.some(t=>t.studyType==='ielts_listening');
  const hasSpeaking=day.lifeTasks.some(t=>t.studyType==='ielts_speaking');
  if(!hasListening)day.lifeTasks.splice(2,0,{id:uid(),text:"雅思听力 x1",done:false,note:"",studyType:"ielts_listening"});
  if(!hasSpeaking)day.lifeTasks.splice(3,0,{id:uid(),text:"雅思口语 x1",done:false,note:"",studyType:"ielts_speaking"});
  return day;
}

function updateStreak(){
  const today=fmtDate(new Date());
  if(appData.lastActiveDate!==today){
    const yest=fmtDate(new Date(Date.now()-86400000));
    appData.streak=(appData.lastActiveDate===yest)?appData.streak+1:1;
    appData.lastActiveDate=today;saveData();
  }
}

// ============ UNDO ============
function toastWithUndo(msg,undoFn){
  const el=document.getElementById('toast');
  el.innerHTML=msg+' <span class="toast-undo" onclick="doUndo()">撤销</span>';
  el.classList.add('show');
  el._undoFn=undoFn;
  clearTimeout(undoTimeout);
  undoTimeout=setTimeout(()=>{el.classList.remove('show');lastDeleted=null;el._undoFn=null},5000);
}
function doUndo(){
  const el=document.getElementById('toast');
  if(el._undoFn){el._undoFn();el.classList.remove('show');lastDeleted=null;el._undoFn=null}
  clearTimeout(undoTimeout);
}
function toastSimple(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600);t._undoFn=null}

function navBadge(id){
  if(id==='work'){const day=getDay(currentDate);return day.workTasks.filter(t=>!t.done).length}
  if(id==='study'){const day=getDay(currentDate);return day.lifeTasks.filter(t=>!t.done).length}
  if(id==='invest')return appData.funds.length||null;
  if(id==='memo'){const today=fmtDate(new Date());const yest=fmtDate(new Date(Date.now()-86400000));if(appData.dates[yest]&&appData.dates[yest].memoRemind&&appData.dates[yest].memo)return '!';return null}
  if(id==='hot'){const day=getDay(currentDate);return day.hotDaily?day.hotDaily.length:0}
  if(id==='talent')return appData.talents?appData.talents.length:null;
  if(id==='script')return appData.scripts?appData.scripts.length:null;
  if(id==='plan'){const total=appData.plans.reduce((s,sec)=>s+sec.goals.length,0);const done=appData.plans.reduce((s,sec)=>s+sec.goals.filter(g=>g.done).length,0);return done+'/'+total}

}

function buildWorkCard(t,idx){
  const isDone=t.done;
  let cntHtml='';
  if(t.count){
    cntHtml=`<span class="task-badge">${t.count.cur}/${t.count.target}</span>
    <span class="count-btns">
      <button class="count-btn" onclick="event.stopPropagation();adjCount(${idx},-1)">-</button>
      <span style="font-size:.7rem;font-weight:600;min-width:14px;text-align:center">${t.count.cur}</span>
      <button class="count-btn" onclick="event.stopPropagation();adjCount(${idx},1)">+</button>
    </span>`;
  }
  let linksHtml='';
  if(t.links&&t.links.length)linksHtml='<div class="task-links">'+t.links.map(l=>`<a class="task-link" href="${l.url}" target="_blank" onclick="event.stopPropagation()">${l.label}</a>`).join('')+'</div>';

  return `<div class="task-item${isDone?' done-item':''}${t._expanded?' expanded':''}">
    <div class="task-top">
      <div class="task-chk${isDone?' done':''}" onclick="event.stopPropagation();chkW(${idx})"></div>
      <div class="task-body" onclick="toggleWCard(${idx})">
        <div class="task-text">${t.text}</div>
        <div class="task-row">${cntHtml}</div>${linksHtml}
      </div>
      <div class="task-actions">
        <button class="task-del" onclick="event.stopPropagation();delW(${idx})">&#10005;</button>
      </div>
    </div>
    <div class="task-note-wrap">
      <textarea class="task-note-area" placeholder="备注笔记..." onclick="event.stopPropagation()" onchange="saveWNote(${idx},this.value)">${t.note||''}</textarea>
    </div>
    <div class="task-note-hint" onclick="event.stopPropagation();toggleWCard(${idx})">${t._expanded?'&#9650; 收起备注':'&#9660; 展开备注'}</div>
  </div>`;
}

function chkW(idx){const day=getDay(currentDate);const t=day.workTasks[idx];t.done=!t.done;if(t.done&&t.count)t.count.cur=t.count.target;saveData();renderWork();renderStats();renderSidebar()}
function adjCount(idx,d){const day=getDay(currentDate);const c=day.workTasks[idx].count;if(!c)return;c.cur=Math.max(0,Math.min(c.target,c.cur+d));if(c.cur>=c.target)day.workTasks[idx].done=true;else day.workTasks[idx].done=false;saveData();renderWork();renderStats()}
function saveWNote(idx,v){const day=getDay(currentDate);day.workTasks[idx].note=v;saveData()}
function delW(idx){

// ============ STUDY PANEL ============
// 根据科目获取当天学习内容（不重复，循环完后从头开始）
// 雅思科目支持分级：L1学完自动升级L2，L2学完升L3
function getTodayStudy(studyType){
  const progress=appData.studyProgress[studyType]||0;
  let pool=[];
  let count=0;
  if(studyType==='ielts_words'){
    const level=appData.studyLevel?.ielts_words||1;
    pool=IELTS_WORDS.filter(w=>w.level===level);
    count=10;
  }else if(studyType==='ielts_reading'){
    const level=appData.studyLevel?.ielts_reading||1;
    pool=IELTS_READING.filter(w=>w.level===level);
    count=1;
  }else if(studyType==='ielts_listening'){
    const level=appData.studyLevel?.ielts_listening||1;
    pool=IELTS_LISTENING.filter(w=>w.level===level);
    count=1;
  }else if(studyType==='ielts_speaking'){
    const level=appData.studyLevel?.ielts_speaking||1;
    pool=IELTS_SPEAKING.filter(w=>w.level===level);
    count=1;
  }else if(studyType==='trade_words'){pool=TRADE_WORDS;count=5}
  else if(studyType==='ecommerce'){pool=ECOMMERCE_KNOWLEDGE;count=1}
  if(!pool.length)pool=[{word:"暂无内容",meaning:"题库为空",example:"",level:1}];
  const items=[];
  for(let i=0;i<count;i++){
    const idx=(progress+i)%pool.length;
    items.push({...pool[idx],_idx:idx});
  }
  return items;
}

// 获取某科目当前级别信息
function getStudyLevelInfo(studyType){
  if(!['ielts_words','ielts_reading','ielts_listening','ielts_speaking'].includes(studyType))return null;
  const level=appData.studyLevel?.[studyType]||1;
  const levelName=level===1?'初级':(level===2?'中级':'高级');
  let poolSize=0;
  if(studyType==='ielts_words')poolSize=IELTS_WORDS.filter(w=>w.level===level).length;
  else if(studyType==='ielts_reading')poolSize=IELTS_READING.filter(w=>w.level===level).length;
  else if(studyType==='ielts_listening')poolSize=IELTS_LISTENING.filter(w=>w.level===level).length;
  else if(studyType==='ielts_speaking')poolSize=IELTS_SPEAKING.filter(w=>w.level===level).length;
  const progress=appData.studyProgress[studyType]||0;
  return {level,levelName,poolSize,progress};
}

// 标记当天学习完成，记录历史并推进进度
function completeStudy(studyType){
  const items=getTodayStudy(studyType);
  const dateKey=currentDate;
  if(!appData.studyHistory[dateKey])appData.studyHistory[dateKey]={};
  appData.studyHistory[dateKey][studyType]={items:items.map(it=>{const {_idx,...rest}=it;return rest}),completedAt:Date.now()};
  // 推进进度（循环）
  let step=10;
  if(studyType==='ielts_words')step=10;
  else if(studyType==='ielts_reading')step=1;
  else if(studyType==='ielts_listening')step=1;
  else if(studyType==='ielts_speaking')step=1;
  else if(studyType==='trade_words')step=5;
  else if(studyType==='ecommerce')step=1;
  const info=getStudyLevelInfo(studyType);
  if(info){
    // 雅思科目：当前级别学完后自动升级
    const newProgress=appData.studyProgress[studyType]+step;
    if(newProgress>=info.poolSize){
      // 学完当前级别，升级
      if(info.level<3){
        appData.studyLevel[studyType]=info.level+1;
        appData.studyProgress[studyType]=0;
        toastSimple('🎉 '+({'ielts_words':'单词',ielts_reading:'阅读',ielts_listening:'听力',ielts_speaking:'口语'}[studyType])+'升级到'+(info.level+1===2?'中级':'高级')+'！');
      }else{
        // 已是最高级，循环
        appData.studyProgress[studyType]=newProgress%info.poolSize;
      }
    }else{
      appData.studyProgress[studyType]=newProgress;
    }
  }else{
    const poolSize={trade_words:TRADE_WORDS.length,ecommerce:ECOMMERCE_KNOWLEDGE.length}[studyType];
    appData.studyProgress[studyType]=(appData.studyProgress[studyType]+step)%poolSize;
  }
  // 标记当天任务完成
  const day=getDay(currentDate);
  const task=day.lifeTasks.find(t=>t.studyType===studyType);
  if(task){
    task.done=true;
    if(task.count)task.count.cur=task.count.target;
  }
  saveData();
  if(activeNav==='study')renderStudy();
  renderStats();renderSidebar();
  const catNames={ielts_words:'雅思单词',ielts_reading:'雅思阅读',ielts_listening:'雅思听力',ielts_speaking:'雅思口语',trade_words:'外贸词汇',ecommerce:'跨境电商知识'};
  toastSimple('已完成今日'+catNames[studyType]+'学习');
}

  document.getElementById('panel-plan').innerHTML=html;
}

function findPlanSec(name){return appData.plans.find(s=>s.section===name)}

// qt.gtimg.cn 返回 v_<code>="..." 格式的 JS 变量赋值，用 script 标签加载
function fetchTencentQuote(codes, callback){
  const scriptId='tencent_quote_'+Date.now();
  const s=document.createElement('script');
  s.id=scriptId;
  s.src='https://qt.gtimg.cn/q='+codes.join(',')+'&_='+Date.now();
  s.charset='gbk';
  s.onload=function(){
    const result={};
    codes.forEach(code=>{
      const v=window['v_'+code];
      if(v){
        // 股票类(如 sh600916)用 ~ 分隔，期货类(如 hf_XAU)用逗号分隔
        if(v.indexOf('~')>=0){
          result[code]={type:'stock',parts:v.split('~')};
        }else{
          result[code]={type:'future',parts:v.split(',')};
        }
      }
    });
    callback(result);
    s.remove();
  };
  s.onerror=function(){callback({});s.remove()};
  document.body.appendChild(s);
}

// 缓存汇率，避免每次刷新都请求
let goldUsdCnyRate = 0;
let goldLastUpdate = '';

async function fetchGold(showToast){
  const panel=document.getElementById('panel-invest');
  if(!panel||!panel.classList.contains('active'))return;
  if(showToast)toastSimple('正在刷新行情...');

  // 并行获取汇率和行情
  if(!goldUsdCnyRate){
    try{
      const resp=await fetch('https://api.exchangerate-api.com/v4/latest/USD');
      const json=await resp.json();
      if(json&&json.rates&&json.rates.CNY)goldUsdCnyRate=json.rates.CNY;
    }catch(e){console.warn('汇率获取失败',e)}
  }

  // 抓取：国际金价(hf_XAU)、中国黄金(sh600916)、黄金ETF(sh518880)
  fetchTencentQuote(['hf_XAU','sh600916','sh518880'],function(data){
    let intPrice=0,intChg=0,intTime='';
    // 国际金价 hf_XAU (期货格式，逗号分隔): "现价,?,?,最高,最低,时间,昨收,..."
    if(data['hf_XAU'] && data['hf_XAU'].type==='future'){
      const p=data['hf_XAU'].parts;
      intPrice=parseFloat(p[0]);
      const prevClose=parseFloat(p[7]); // 昨收
      intChg=prevClose>0?((intPrice-prevClose)/prevClose*100):0;
      intTime=p[6]||'';
      const elP=document.getElementById('goldInt');
      const elC=document.getElementById('goldIntChg');
      if(elP&&!isNaN(intPrice))elP.textContent='$'+intPrice.toFixed(2)+'/oz';
      if(elC&&!isNaN(intChg)){
        elC.innerHTML=(intChg>=0?'&#9650;':'&#9660;')+Math.abs(intChg).toFixed(2)+'%';
        elC.className='gold-row-chg '+(intChg>=0?'up':'down');
      }
    }
    // 上海金交所 Au9999 参考价 = 伦敦金(美元/盎司) × 汇率 ÷ 31.1035g/盎司
    if(intPrice>0 && goldUsdCnyRate>0){
      const au9999=intPrice*goldUsdCnyRate/31.1035;
      const elS=document.getElementById('goldSHFE');
      const elSC=document.getElementById('goldSHFEChg');
      if(elS)elS.textContent='¥'+au9999.toFixed(2)+'/g';
      if(elSC&&!isNaN(intChg)){
        elSC.innerHTML=(intChg>=0?'&#9650;':'&#9660;')+Math.abs(intChg).toFixed(2)+'%';
        elSC.className='gold-row-chg '+(intChg>=0?'up':'down');
      }
    }else{
      const elS=document.getElementById('goldSHFE');
      if(elS&&intPrice>0)elS.textContent='¥'+(intPrice*6.79/31.1035).toFixed(2)+'/g (估算)';
    }
    // 中国黄金 sh600916 (股票格式，~分隔):
    if(data['sh600916'] && data['sh600916'].type==='stock'){
      const p=data['sh600916'].parts;
      const price=parseFloat(p[3]);
      const chgPct=parseFloat(p[32]); // 涨跌幅%
      const elP=document.getElementById('gold600916');
      const elC=document.getElementById('gold600916Chg');
      if(elP&&!isNaN(price))elP.textContent='¥'+price.toFixed(3);
      if(elC&&!isNaN(chgPct)){
        elC.innerHTML=(chgPct>=0?'&#9650;':'&#9660;')+Math.abs(chgPct).toFixed(2)+'%';
        elC.className='gold-row-chg '+(chgPct>=0?'up':'down');
      }
    }
    // 黄金ETF sh518880
    if(data['sh518880'] && data['sh518880'].type==='stock'){
      const p=data['sh518880'].parts;
      const price=parseFloat(p[3]);
      const chgPct=parseFloat(p[32]);
      const elP=document.getElementById('goldETF');
      const elC=document.getElementById('goldETFChg');
      if(elP&&!isNaN(price))elP.textContent='¥'+price.toFixed(3);
      if(elC&&!isNaN(chgPct)){
        elC.innerHTML=(chgPct>=0?'&#9650;':'&#9660;')+Math.abs(chgPct).toFixed(2)+'%';
        elC.className='gold-row-chg '+(chgPct>=0?'up':'down');
      }
    }
    // 更新时间
    const elT=document.getElementById('goldTime');
    const now=new Date();
    const hh=String(now.getHours()).padStart(2,'0');
    const mm=String(now.getMinutes()).padStart(2,'0');
    const ss=String(now.getSeconds()).padStart(2,'0');
    goldLastUpdate=hh+':'+mm+':'+ss;
    if(elT)elT.textContent='更新于 '+goldLastUpdate;
    if(showToast)toastSimple('行情已刷新');
  });
}

let fcbCnt=0;
function fetchFund(code){
  return new Promise(resolve=>{
    const cb='fcb_'+fcbCnt++;
    window[cb]=function(d){resolve(d);delete window[cb]};
    const s=document.createElement('script');
    s.src='https://fundgz.1234567.com.cn/js/'+code+'.js?rt='+Date.now();
    s.onerror=()=>{resolve(null);delete window[cb]};
    setTimeout(()=>{if(window[cb]){resolve(null);delete window[cb]}},6000);
    document.body.appendChild(s);
  });
}

function showCustomModal(title, bodyHtml){
  let m=document.getElementById('customModal');
  if(!m){
    m=document.createElement('div');
    m.className='modal-overlay';
    m.id='customModal';
    m.style.display='flex';
    m.innerHTML=`<div class="modal"><div class="modal-hd"><span id="customModalTitle"></span><button class="modal-close" onclick="closeFundModal()">&#10005;</button></div><div class="modal-bd" id="customModalBody"></div></div>`;
    document.body.appendChild(m);
  }
  document.getElementById('customModalTitle').innerHTML=title;
  document.getElementById('customModalBody').innerHTML=bodyHtml;
  m.classList.add('show');
  m.style.display='flex';
}

function closeFundModal(){
  const m=document.getElementById('customModal');
  if(m){m.classList.remove('show');m.style.display='none'}
}

function batchAddFunds(){
  const inp=document.getElementById('fundBatchInput');
  if(!inp)return;
  const raw=inp.value.trim();
  if(!raw){toastSimple('请输入基金代码');return}
  // 支持逗号、空格、换行、分号分隔
  const codes=raw.split(/[\s,;，；\n\r]+/).map(s=>s.trim()).filter(s=>/^\d{6}$/.test(s));
  if(!codes.length){toastSimple('未识别到有效的6位基金代码');return}
  let added=0,dup=0;
  codes.forEach(c=>{
    if(!appData.funds.includes(c)){appData.funds.push(c);added++}
    else dup++;
  });
  saveData();
  fetchAllFunds();
  renderSidebar();
  toastSimple('已添加 '+added+' 只'+(dup?('·'+dup+' 只重复'):''));
  // 刷新 modal
  showFundModal();
}

function delFund(idx){
  appData.funds.splice(idx,1);
  saveData();
  fetchAllFunds();
  renderSidebar();
  showFundModal();
}

function renderHot(){
  const day=getDay(currentDate);
  // 确保数据就绪：hotDaily 必须是非空数组，否则生成一次（不再递归调用 renderHot）
  if(!day.hotDaily || !Array.isArray(day.hotDaily) || !day.hotDaily.length){
    genHotDailyData();
  }
  // 确保 userVideos 数组存在（用户手动添加的视频，永久保留）
  if(!appData.userVideos || !Array.isArray(appData.userVideos)) appData.userVideos=[];
  const plat=hotPlatform;const cat=hotCategory;
  // 用户添加的视频 + 灵感种子，用户视频排前面
  const userItems=appData.userVideos.filter(v=>v.platform===plat&&v.category===cat);
  const seedItems=(day.hotDaily||[]).filter(v=>v.platform===plat&&v.category===cat);
  const items=userItems.concat(seedItems);
  let html=`<div class="card">
    <div class="card-hd" style="color:var(--primary)">&#128293; 爆款选题灵感 <span style="font-size:.67rem;font-weight:400;color:var(--text3)">(${fmtDate(new Date())} 更新)</span>
      <span class="hot-refresh" onclick="genHotDaily()">&#128260; 刷新灵感</span>
      <span class="hot-refresh" onclick="openAddVideoModal()" style="color:var(--primary)">&#10133; 添加视频</span>
    </div>`;
  html+=`<div class="hot-platform-tabs">
    <div class="hot-ptab${plat==='douyin'?' active':''}" onclick="switchHotPlat('douyin')">&#127925; 抖音</div>
    <div class="hot-ptab${plat==='xiaohongshu'?' active':''}" onclick="switchHotPlat('xiaohongshu')">&#128247; 小红书</div>
  </div>`;
  html+=`<div class="hot-cat-tabs">
    <div class="hot-ctab${cat==='beauty'?' active':''}" onclick="switchHotCat('beauty')">&#128132; 美妆护肤</div>
    <div class="hot-ctab${cat==='home'?' active':''}" onclick="switchHotCat('home')">&#127968; 家政清洁</div>
    <div class="hot-ctab${cat==='goods'?' active':''}" onclick="switchHotCat('goods')">&#128722; 带货爆款</div>
  </div>`;
  // 用户添加的视频数量提示
  if(userItems.length){
    html+=`<div class="hot-user-tip">&#11088; 我的收藏：${userItems.length} 个视频（排在最前）</div>`;
  }
  items.forEach((v,idx)=>{
    // 爆点小结：hook/structure/rhythm/cart
    const hookV=v.hook?('钩子：'+v.hook):'';
    const structV=v.structure?('结构：'+v.structure):'';
    const rhythmV=v.rhythm?('节奏：'+v.rhythm):'';
    const cartV=v.cart?('挂车：'+v.cart):'';
    const insightHtml=[hookV,structV,rhythmV,cartV].filter(Boolean).map(t=>`<div class="hot-insight-line">${t}</div>`).join('');
    // 视频链接：若有真实 videoUrl 则展示「看视频」，否则展示「跳转搜索页」
    let linkHtml='';
    if(v.videoUrl){
      linkHtml=`<a class="hot-video-link" href="${v.videoUrl}" target="_blank" rel="noopener">&#127909; 看原视频</a>`;
    }
    if(v.searchUrl){
      linkHtml+=`<a class="hot-search-link" href="${v.searchUrl}" target="_blank" rel="noopener">&#128269; 看平台热门</a>`;
    }
    // 用户添加的视频可删除
    const isUser=v.isUser;
    const delHtml=isUser?`<span class="hot-card-del" onclick="delUserVideo(${appData.userVideos.indexOf(v)})">&#10005;</span>`:'';
    const userTag=isUser?`<span class="hot-card-tag mine">&#11088; 我的</span>`:'';
    html+=`<div class="hot-card ${isUser?'hot-card-mine':''}">
      ${delHtml}
      <div class="hot-card-title">${v.title}</div>
      <div class="hot-card-desc">${v.desc}</div>
      ${insightHtml?`<div class="hot-insight-block">${insightHtml}</div>`:''}
      <div class="hot-card-tags">
        <span class="hot-card-tag ${v.platform==='douyin'?'dy':'xhs'}">${v.platform==='douyin'?'抖音':'小红书'}</span>
        <span class="hot-card-tag ${v.category==='beauty'?'mz':(v.category==='home'?'jz':'goods')}">${v.category==='beauty'?'美妆':(v.category==='home'?'家政':'带货')}</span>
        ${userTag}
      </div>
      ${linkHtml?`<div class="hot-card-links">${linkHtml}</div>`:''}
    </div>`;
  });
  if(!items.length)html+='<div style="text-align:center;padding:16px;color:var(--text3);font-size:.74rem">点击刷新获取今日灵感，或点「添加视频」粘贴你收藏的爆款链接</div>';
  html+='</div>';
  document.getElementById('panel-hot').innerHTML=html;
}

// 仅生成数据，不触发渲染（避免递归）
function genHotDailyData(){
  const day=getDay(currentDate);
  const all=[];
  Object.keys(HOT_SEEDS).forEach(plat=>{
    Object.keys(HOT_SEEDS[plat]).forEach(cat=>{
      all.push(...shuffle(HOT_SEEDS[plat][cat]).slice(0,5));
    });
  });
  day.hotDaily=shuffle(all);
  saveData();
}

function genHotDaily(){
  genHotDailyData();
  renderHot();renderSidebar();
}

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function switchHotPlat(p){hotPlatform=p;renderHot()}
function switchHotCat(c){hotCategory=c;renderHot()}

// 识别抖音/小红书链接，自动判断平台
function detectPlatform(url){
  if(/douyin\.com|v\.douyin\.com|iesdouyin\.com/i.test(url))return 'douyin';
  if(/xiaohongshu\.com|xhslink\.com/i.test(url))return 'xiaohongshu';
  return null;
}

let pickedVideoCat='beauty';
function pickVideoCat(el){
  document.querySelectorAll('#videoCatPicker .vcp-item').forEach(e=>e.classList.remove('active'));
  el.classList.add('active');
  pickedVideoCat=el.dataset.cat;
}

function addUserVideo(){
  const url=(document.getElementById('videoUrlInput')?.value||'').trim();
  const title=(document.getElementById('videoTitleInput')?.value||'').trim();
  if(!url){toastSimple('请粘贴视频链接');return}
  if(!title){toastSimple('请填写视频标题');return}
  const platform=detectPlatform(url);
  if(!platform){toastSimple('未识别到抖音/小红书链接');return}
  if(!appData.userVideos)appData.userVideos=[];
  // 读取爆点字段，留空用模板
  const cat=pickedVideoCat;
  const hook=(document.getElementById('videoHook')?.value||'').trim()||'（待补充）';
  const structure=(document.getElementById('videoStruct')?.value||'').trim()||'（待补充）';
  const rhythm=(document.getElementById('videoRhythm')?.value||'').trim()||'（待补充）';
  const cart=(document.getElementById('videoCart')?.value||'').trim()||'（待补充）';
  appData.userVideos.push({
    title:title,
    desc:'用户收藏的爆款视频',
    platform:platform,
    category:cat,
    hook:hook,structure:structure,rhythm:rhythm,cart:cart,
    videoUrl:url,
    isUser:true,
    addedAt:Date.now()
  });
  saveData();
  closeFundModal();
  // 切到对应平台和品类并渲染
  hotPlatform=platform;
  hotCategory=cat;
  renderHot();
  renderSidebar();
  toastSimple('已添加到「'+(platform==='douyin'?'抖音':'小红书')+'·'+(cat==='beauty'?'美妆':(cat==='home'?'家政':'带货'))+'」');
}

function delUserVideo(idx){
  if(idx<0||idx>=appData.userVideos.length)return;
  appData.userVideos.splice(idx,1);
  saveData();
  renderHot();
  renderSidebar();
  toastSimple('已删除');
}

// ============ SYNC ============
function openSyncModal(){
  const el=document.getElementById('syncModal');
  el.classList.add('show');
  // 显示上次同步时间
  const last=localStorage.getItem('wb_sync_time');
  const lastEl=document.getElementById('syncLastTime');
  if(last)lastEl.textContent='上次同步：'+last;
  else lastEl.textContent='';
  document.getElementById('syncCodeArea').innerHTML='';
}
function closeSyncModal(){document.getElementById('syncModal').classList.remove('show')}

// 压缩数据为短同步码（用 LZString 思路简化：直接 base64 + 去除冗余）
function packData(data){
  const json=JSON.stringify(data);
  // 使用 btoa + encodeURIComponent 压缩
  return btoa(unescape(encodeURIComponent(json)));
}
function unpackData(code){
  try{
    return JSON.parse(decodeURIComponent(escape(atob(code))));
  }catch(e){return null}
}

// 生成同步码（分段模式）
function showSyncCode(){
  const code=packData(appData);
  const now=new Date();
  const ts=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  localStorage.setItem('wb_sync_time',ts);
  // 每段最多2000字符（微信单条消息限制约4000，取2000更安全）
  const chunkSize=2000;
  const total=Math.ceil(code.length/chunkSize);
  let chunkHtml='';
  for(let i=0;i<total;i++){
    const chunk=code.slice(i*chunkSize,(i+1)*chunkSize);
    const label='['+(i+1)+'/'+total+']';
    const fullChunk=label+chunk;
    chunkHtml+=`<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)">
      <span style="font-size:.7rem;font-weight:600;color:var(--primary);white-space:nowrap">第${i+1}段</span>
      <code style="flex:1;font-size:.58rem;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${chunk.slice(0,30)}...</code>
      <button class="topbar-btn" style="background:var(--primary);color:#fff;border:none;font-size:.65rem;padding:3px 8px" onclick="copyChunk('${fullChunk.replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/\n/g,'\\n')}','${i+1}')">复制</button>
    </div>`;
  }
  const area=document.getElementById('syncCodeArea');
  area.innerHTML=`<div style="background:var(--bg);border-radius:8px;padding:12px;margin-top:8px">
    <div style="font-size:.7rem;color:var(--text2);margin-bottom:4px">&#128273; 分段同步码 · ${ts} · 共${total}段</div>
    <div style="font-size:.62rem;color:var(--orange);margin-bottom:8px">&#9888; 按顺序逐段复制发到微信，在另一设备逐段粘贴</div>
    <div style="max-height:200px;overflow-y:auto">${chunkHtml}</div>
    <div style="display:flex;gap:6px;margin-top:8px">
      <button class="topbar-btn" style="flex:1;background:var(--teal);color:#fff;border:none" onclick="copyAllChunks()">&#128203; 一键复制全部</button>
    </div>
    <div style="font-size:.64rem;color:var(--text3);margin-top:6px">逐段发送到微信"文件传输助手"，接收端点「输入同步码」按顺序粘贴即可自动合并</div>
  </div>`;
  // 存完整code供一键复制
  window._syncFullCode=code;
  window._syncTotal=total;
  window._syncChunkSize=chunkSize;
  toastSimple('同步码已分段');
}

function copyChunk(chunk,num){
  if(navigator.clipboard){
    navigator.clipboard.writeText(chunk).then(()=>toastSimple('第'+num+'段已复制，发到微信'));
  }else{
    const ta=document.createElement('textarea');ta.value=chunk;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);toastSimple('第'+num+'段已复制');
  }
}

function copyAllChunks(){
  if(!window._syncFullCode){toastSimple('请先生成同步码');return}
  // 生成全部带标签的文本
  const total=window._syncTotal;
  const size=window._syncChunkSize;
  let all='';
  for(let i=0;i<total;i++){
    all+='['+(i+1)+'/'+total+']'+window._syncFullCode.slice(i*size,(i+1)*size)+'\n';
  }
  if(navigator.clipboard){
    navigator.clipboard.writeText(all).then(()=>toastSimple('已复制全部'+total+'段'));
  }else{
    const ta=document.createElement('textarea');ta.value=all;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);toastSimple('已复制全部');
  }
}

// 分享同步码（调用系统分享，用于手机）
function shareCode(code){
  if(navigator.share){
    navigator.share({title:'工作台同步码',text:code}).catch(()=>{});
  }else{
    copyFullCode(code);
  }
}

// 输入同步码恢复（支持多段自动合并）
function showImportCode(){
  const area=document.getElementById('syncCodeArea');
  area.innerHTML=`<div style="background:var(--bg);border-radius:8px;padding:12px;margin-top:8px">
    <div style="font-size:.7rem;color:var(--text2);margin-bottom:6px">&#128229; 粘贴同步码（支持多段自动合并）</div>
    <textarea id="syncCodeInput" class="fund-batch-ta" placeholder="将同步码逐段粘贴到这里（可多次粘贴，自动合并）..." style="min-height:80px;font-family:monospace;font-size:.65rem"></textarea>
    <div style="display:flex;gap:6px;margin-top:8px">
      <button class="topbar-btn" style="flex:1;background:var(--primary);color:#fff;border:none" onclick="doImportCode()">&#128260; 恢复数据</button>
      <button class="topbar-btn" style="background:var(--text3);color:#fff;border:none" onclick="document.getElementById('syncCodeArea').innerHTML=''">取消</button>
    </div>
    <div style="font-size:.64rem;color:var(--orange);margin-top:6px">&#9888; 恢复将覆盖当前数据。可多次粘贴，系统自动识别分段标记并合并。</div>
  </div>`;
}

function doImportCode(){
  const raw=document.getElementById('syncCodeInput').value.trim();
  if(!raw){toastSimple('请粘贴同步码');return}
  // 智能解析：检测是否包含分段标记 [1/3] [2/3] 等
  let code;
  if(/\[\d+\/\d+\]/.test(raw)){
    // 分段模式：提取各段并按序号拼接
    const parts=[];
    const regex=/\[(\d+)\/(\d+)\]([^\[]*)/g;
    let m;
    while((m=regex.exec(raw))!==null){
      const idx=parseInt(m[1])-1;
      parts[idx]=m[3];
    }
    // 也处理纯换行分隔的情况
    code=parts.filter(Boolean).join('');
    if(!code){
      // 尝试按行解析（每行可能有标记或没有）
      const lines=raw.split(/[\n\r]+/).filter(Boolean);
      code=lines.map(l=>l.replace(/^\[\d+\/\d+\]/,'')).join('');
    }
  }else{
    code=raw;
  }
  if(!code){toastSimple('未识别到有效同步码');return}
  const data=unpackData(code);
  if(!data){toastSimple('同步码格式错误，请检查是否完整复制');return}
  if(!confirm('将用同步码数据覆盖当前工作台所有数据，确定继续？'))return;
  appData=data;
  saveData();
  const now=new Date();
  const ts=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  localStorage.setItem('wb_sync_time',ts);
  renderAll();switchNav(activeNav);
  closeSyncModal();
  toastSimple('数据已恢复！');
}

function exportData(){
  const blob=new Blob([JSON.stringify(appData)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='zhous_workbench_'+fmtDate(new Date())+'.json';
  a.click();URL.revokeObjectURL(url);toastSimple('已导出');
}
function importData(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=function(ev){
    try{appData=JSON.parse(ev.target.result);saveData();renderAll();switchNav(activeNav);toastSimple('已导入');closeSyncModal()}
    catch(err){toastSimple('格式错误')}
  };
  r.readAsText(f);
}

// ============ INIT ============
function init(){
  loadData();updateStreak();
  renderAll();switchNav('work');
  setInterval(()=>{fetchGold();fetchAllFunds();renderStats();renderSidebar()},30000);
}
init();
</script>
</body>
